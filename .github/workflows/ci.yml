name: CI

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "e2e_test.sh"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test-all
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run full test suite
        run: make test-all
